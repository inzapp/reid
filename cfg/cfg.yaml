devices: [0]
pretrained_model_path: null
train_data_path: /train_data/market1501/Market-1501-v15.09.15/bounding_box_train
validation_data_path: /train_data/market1501/Market-1501-v15.09.15/bounding_box_test
query_data_path: /train_data/market1501/Market-1501-v15.09.15/query

input_rows: 64
input_cols: 128
input_channels: 3
embedding_dim: 512
maximum_negative_distance: 1.0
# Distances below this value are classified as the same object. If null,
# the validation EER threshold is used for diagnostic TAR/FAR reporting.
verification_threshold: null

model_name: reid
optimizer: adam
lr_policy: cosine
lr: 0.001
lrf: 0.05
l2: 0.0005
warm_up: 1000
momentum: 0.9

# batch_size is the number of triplets consumed at each iteration.
batch_size: 32
max_q_size: 256
num_loader_workers: 4
iterations: 10000
checkpoint_interval: 1000
fix_seed: false

# Validation images are embedded once; only sampled index distances are kept.
validation_pair_count: 100000
evaluation_batch_size: 32
evaluation_pair_chunk_size: 8192

# ReID augmentation parameters.
horizontal_flip_probability: 0.5
random_erasing_probability: 0.5
color_jitter: 0.15
random_crop_padding: 10
